name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm run lint                    # gate 1
      - run: npm run test:run                # gate 2 (Vitest)
      - run: npx playwright install --with-deps
      - run: npm run test:e2e                # gate 3 (Playwright)
      - name: Deploy a Vercel
        if: success()                        # solo si 1-3 pasaron
        run: npx vercel deploy --prod --yes --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
