name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Check required secrets are present
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then echo "::error::NEXT_PUBLIC_SUPABASE_URL is missing/empty"; else echo "NEXT_PUBLIC_SUPABASE_URL OK (len=${#NEXT_PUBLIC_SUPABASE_URL})"; fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then echo "::error::NEXT_PUBLIC_SUPABASE_ANON_KEY is missing/empty"; else echo "NEXT_PUBLIC_SUPABASE_ANON_KEY OK (len=${#NEXT_PUBLIC_SUPABASE_ANON_KEY})"; fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then exit 1; fi
      - run: npm ci
      - run: npm run lint                    # gate 1
      - run: npm run test:run                # gate 2 (Vitest)
      - run: npx playwright install --with-deps
      - run: npm run test:e2e                # gate 3 (Playwright)
      - name: Deploy a Vercel
        if: success()                        # solo si 1-3 pasaron
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "::error::VERCEL_TOKEN is missing/empty — set it in repo secrets"; exit 1; fi
          if [ -z "$VERCEL_ORG_ID" ]; then echo "::error::VERCEL_ORG_ID is missing/empty"; exit 1; fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then echo "::error::VERCEL_PROJECT_ID is missing/empty"; exit 1; fi
          npx vercel deploy --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
